<!doctype html><meta charset="utf-8"><title>Synthetic storage context control</title>
<script type="module">
import {openPortfolioDB,readPortfolioRecord} from '/app/src/atomic-storage.js';
const step=new URL(location.href).searchParams.get('step');
if(step==='parent'){
 const frame=document.createElement('iframe');
 frame.src='http://127.0.0.1:'+location.port+'/tests/native-safari/storage-context.html?step=embedded';
 document.body.append(frame);
}else{
 const report={step,origin:location.origin,topLevel:window.top===window.self,referrer:document.referrer};
 try{
  if(step==='first')localStorage.setItem('qa-site-test','first-party');
  report.firstPartyToken=localStorage.getItem('qa-site-test');
  report.thirdPartyToken=localStorage.getItem('qa-isolated-test');
  if(step==='embedded')localStorage.setItem('qa-isolated-test','third-party');
 }catch(e){report.localStorageError=e.name;}
 try{report.hasStorageAccess=await document.hasStorageAccess();}catch(e){report.storageAccessError=e.name;}
 try{
  const db=await openPortfolioDB();
  try{const record=await readPortfolioRecord(db);report.revision=record?.revision??null;report.cash=record?.raw?JSON.parse(record.raw).positions[0]?.quantityExact??null:null;}finally{db.close();}
 }catch(e){report.indexedDBError=e.name;}
 await fetch('/result',{method:'POST',body:JSON.stringify(report)});
}
</script><body></body>
