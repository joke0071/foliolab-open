name: v317 HTTP503 exact asset availability diagnosis
on:
  push:
    branches: [diagnostic/v317-http503-9142fbd8]
permissions:
  contents: read
concurrency:
  group: v317-http503-9142fbd8
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install identical Chromium transport
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Capture published responses without retries or state changes
        run: node tests/v317-http503-diagnosis.mjs
      - name: Preserve original responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v317-http503-${{ github.sha }}
          path: artifacts/v317-http503/
          if-no-files-found: error
