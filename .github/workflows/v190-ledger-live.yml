name: v190 – targeted Ledger production acceptance
on:
  push:
    branches: [qa/v190-ledger-live]
    paths-ignore: ['docs/**']
permissions:
  contents: read
jobs:
  ledger-production:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: 7b7fae74d864914c9c4f4dab6a2300c8ee0e0ef5
      FLH03_BASE_URL: https://foliolab.unperfekt.at/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exactly released app and test bytes
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA" --depth=1
          git diff --exit-code "$RELEASE_SHA" HEAD -- src styles.css sw.js index.html manifest.webmanifest icons tests package.json
          mkdir -p artifacts/gates
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const base=process.env.FLH03_BASE_URL,sha=process.env.RELEASE_SHA;
          assert.equal(base,'https://foliolab.unperfekt.at/');
          const paths=['sw.js','src/app.js','src/ledger-live.js','src/ledger-live-ui.js','styles.css','src/model.js','src/atomic-storage.js','src/browser-portfolio-storage.js','src/decimal.js','src/import-identity.js','src/purchase-evidence.js','src/historical-position-value.js'];
          const hashes=[];
          for(const path of paths){
            const u=new URL(path,base);u.searchParams.set('ledger-release-check',sha);
            const response=await fetch(u);assert.equal(response.status,200,path);
            const actual=Buffer.from(await response.arrayBuffer()),expected=readFileSync(path);
            assert.ok(actual.equals(expected),'Published source differs: '+path);
            hashes.push({path,sha256:createHash('sha256').update(actual).digest('hex')});
          }
          assert.match(readFileSync('sw.js','utf8'),/const CACHE='foliolab-open-v190'/);
          writeFileSync('artifacts/gates/ledger-production-assets.json',JSON.stringify({releaseSha:sha,base,cache:'foliolab-open-v190',hashes},null,2));
          console.log('V190 LEDGER LIVE: '+hashes.length+' exact published source hashes; released app/test tree unchanged');
          NODE
      - name: Use actual production origin for isolated synthetic setup without interception
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const source=readFileSync('tests/browser-ledger-live.mjs','utf8');
          const marker="await page.goto(new URL('tests/storage-origin.html',base).href);";
          assert.equal(source.split(marker).length,2,'one exact setup-only origin navigation');
          const actualOrigin="await page.goto(base);await page.waitForFunction(()=>document.getElementById('portfolioStorageState')?.textContent.includes('IndexedDB aktiv'));";
          writeFileSync('tests/.v190-ledger-production.mjs',source.replace(marker,actualOrigin));
          writeFileSync('artifacts/gates/ledger-production-setup.json',JSON.stringify({release:process.env.RELEASE_SHA,originalTest:'tests/browser-ledger-live.mjs',unchangedAssertions:true,setup:'fresh actual production origin; synthetic fixture before baseline',networkInterception:false,productionAssetsIntercepted:false},null,2));
          NODE
      - name: Install Chromium test environment
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install chromium --only-shell
      - name: Actual Ledger workflows in production Chromium
        run: |
          set -euo pipefail
          node tests/.v190-ledger-production.mjs 2>&1 | tee artifacts/gates/ledger-production-chromium.log
      - name: Install Firefox and WebKit test environment
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          npm install --no-save playwright@1.64.1 axe-core@4.10.3
          DEBUG=pw:install npx playwright install --with-deps firefox webkit
      - name: Actual Ledger workflows in production Firefox and WebKit
        env:
          FLH03_ENGINES: firefox,webkit
        run: |
          set -euo pipefail
          node tests/.v190-ledger-production.mjs 2>&1 | tee artifacts/gates/ledger-production-cross.log
      - name: Preserve actual production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v190-ledger-production-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: error
