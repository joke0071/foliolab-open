name: FolioLab Open – testen und veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "p0/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foliolab-open-pages-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a service-worker cache revision for shipped asset changes
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD -- index.html styles.css manifest.webmanifest src icons; then
            echo 'No shipped application assets changed; cache revision unchanged is allowed.'
            exit 0
          fi
          previous="$(git show HEAD^:sw.js | grep '^const CACHE=' || true)"
          current="$(grep '^const CACHE=' sw.js || true)"
          if [[ -z "$previous" || -z "$current" || "$previous" == "$current" ]]; then
            echo 'Shipped app assets changed without a new PWA cache revision.' >&2
            exit 1
          fi
          echo "PWA cache revision changed: $previous -> $current"
      - name: Verify standalone application
        run: |
          set -euo pipefail
          mkdir -p artifacts/gates
          git rev-parse HEAD > artifacts/gates/tested-sha.txt
          npm test 2>&1 | tee artifacts/gates/unit.log
          npm run check 2>&1 | tee artifacts/gates/syntax.log
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3 pngjs@7.0.0
          npx playwright install chromium --only-shell
      - name: Browser smoke tests (320–1440 px)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node tests/browser-smoke.mjs
          node tests/browser-extended.mjs
          node tests/browser-ledger.mjs
          node tests/browser-phase2.mjs
          node tests/browser-phase3.mjs
          node tests/browser-wallet-history-core.mjs
          node tests/browser-bitcoin-history.mjs
          node tests/browser-ethereum-history.mjs
          node tests/browser-history-storage.mjs
          node tests/browser-history-ui.mjs
          node tests/browser-history-worker.mjs
          node tests/browser-p0-import.mjs
          node tests/browser-csv-review-a11y.mjs
          node tests/browser-flatex-import.mjs
          node tests/browser-flatex-backfill.mjs
          node tests/browser-defi-dialog-guidance.mjs
          node tests/browser-audit.mjs
          node tests/browser-dashboard-polish.mjs
          node tests/browser-responsive-actions.mjs
          node tests/browser-allocation.mjs
          node tests/browser-avalanche-valuation.mjs
          node tests/browser-staking-coverage.mjs
          node tests/browser-staking-dialog-scope.mjs
          node tests/browser-modal-clarity.mjs
          node tests/browser-dialog-consistency.mjs
          node tests/browser-position-editor-ux.mjs
          node tests/browser-listing-review-clarity.mjs
          node tests/browser-dialog-visual.mjs
          node tests/browser-dialog-visual-regression.mjs
          node tests/browser-dialog-a11y-mobile.mjs
          node tests/browser-dialog-financial-choices.mjs
          node tests/browser-ledger-xpub.mjs
          node tests/browser-position-drilldown.mjs
          node tests/browser-historical-csv.mjs
          node tests/browser-crypto-history-resilience.mjs
          node tests/browser-etf-crypto-fallbacks.mjs
          node tests/browser-universal-security-discovery.mjs
          node tests/browser-onboarding-suggestions.mjs
          node tests/browser-account-opening.mjs
          node tests/browser-cash-terms.mjs
          node tests/browser-valuation-drilldown.mjs
          node tests/browser-settings-backup.mjs
          node tests/browser-corrupt-backup-restore.mjs
          node tests/browser-multitab-integrity.mjs
          node tests/browser-p0-storage.mjs
          node tests/browser-atomic-storage.mjs
          node tests/browser-idb-cutover.mjs
          node tests/browser-idb-migration-resilience.mjs
          node tests/browser-idb-crash-recovery.mjs
          node tests/browser-idb-concurrent-imports.mjs
          node tests/browser-idb-corrupt-recovery.mjs
          node tests/browser-key-privacy.mjs
          node tests/browser-solana-rpc-help.mjs
          node tests/browser-data-source-settings.mjs
          node tests/browser-eodhd-credentials.mjs
          node tests/browser-position-search.mjs
          node tests/browser-position-details.mjs
          node tests/browser-asset-wizard.mjs
          node tests/browser-booking-filters.mjs
          node tests/browser-dashboard-periods.mjs
          node tests/browser-chart-period-consistency.mjs
          node tests/browser-extended-chart-periods.mjs
          node tests/browser-provider-accordion.mjs
          node tests/browser-legacy-quotes-chevrons.mjs
          node tests/browser-public-instruments.mjs
          node tests/browser-account-deeplink.mjs
          node tests/browser-catalog-expansion.mjs
          node tests/browser-security-catalog.mjs
          node tests/browser-security-sources.mjs
          node tests/browser-eodhd-worker.mjs
          node tests/browser-market-diagnostics.mjs
          node tests/live-probes.mjs
          node tests/browser-accessibility-audit.mjs
          node tests/browser-portfolio-scale.mjs
          node tests/browser-offline-mobile.mjs
          node tests/browser-pwa-updates.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: error
      - name: Preserve representative dialog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-visual-reference
          path: |
            artifacts/dialog-visual/
            artifacts/dialog-visual-diff/
          if-no-files-found: ignore
  cross-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firefox and WebKit for cross-engine regression
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps firefox webkit
      - name: Test portfolio workflows on Firefox and WebKit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-cross-browser.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node tests/browser-cross-engine.mjs
          TERM_ENGINES=firefox,webkit node tests/browser-cash-terms.mjs
          node tests/browser-atomic-storage-cross-engine.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-wallet-history-core.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-bitcoin-history.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-ethereum-history.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-storage.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-ui.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-worker.mjs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [test, cross-engine]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R index.html styles.css manifest.webmanifest sw.js src icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage and matching service-worker version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          expected="$(head -n 1 sw.js)"
          test -n "$expected"
          for attempt in $(seq 1 24); do
            homepage="$(curl -fsSL --connect-timeout 7 --max-time 15 "$base/" || true)"
            service_worker="$(curl -fsSL --connect-timeout 7 --max-time 15 "$base/sw.js" || true)"
            if [[ "$homepage" == *'FolioLab Open'* && "$service_worker" == *"$expected"* ]]; then
              echo "Published homepage and service worker verified: $base (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo 'Live deployment not verified: homepage or service-worker revision differs.' >&2
          exit 1

