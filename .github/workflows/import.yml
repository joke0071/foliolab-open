name: FolioLab Open – testen und veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "p0/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foliolab-open-pages-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a service-worker cache revision for shipped asset changes
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD -- index.html styles.css manifest.webmanifest src icons; then
            echo 'No shipped application assets changed; cache revision unchanged is allowed.'
            exit 0
          fi
          previous="$(git show HEAD^:sw.js | grep '^const CACHE=' || true)"
          current="$(grep '^const CACHE=' sw.js || true)"
          if [[ -z "$previous" || -z "$current" || "$previous" == "$current" ]]; then
            echo 'Shipped app assets changed without a new PWA cache revision.' >&2
            exit 1
          fi
          echo "PWA cache revision changed: $previous -> $current"
      - name: Verify standalone application
        run: |
          set -euo pipefail
          mkdir -p artifacts/gates
          git rev-parse HEAD > artifacts/gates/tested-sha.txt
          npm test 2>&1 | tee artifacts/gates/unit.log
          npm run check 2>&1 | tee artifacts/gates/syntax.log
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3 pngjs@7.0.0
          npx playwright install chromium --only-shell
      - name: Browser smoke tests (320–1440 px)
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node tests/browser-smoke.mjs
          node tests/browser-extended.mjs
          node tests/browser-ledger.mjs
          node tests/browser-phase2.mjs
          node tests/browser-phase3.mjs
          node tests/browser-wallet-history-core.mjs
          node tests/browser-bitcoin-history.mjs
          node tests/browser-ethereum-history.mjs
          node tests/browser-history-storage.mjs
          node tests/browser-history-ui.mjs
          node tests/browser-purchase-evidence.mjs
          node tests/browser-historical-position-value.mjs
          node tests/browser-flh02-release.mjs
          node tests/browser-history-worker.mjs
          node tests/browser-p0-import.mjs
          node tests/browser-csv-review-a11y.mjs
          node tests/browser-csv-batch.mjs
          node tests/browser-flh03-abce.mjs
          node tests/browser-position-selection.mjs
          node tests/browser-position-removal.mjs
          node tests/browser-position-archive.mjs
          node tests/browser-ui-quality.mjs
          node tests/browser-flatex-import.mjs
          node tests/browser-flatex-backfill.mjs
          node tests/browser-defi-dialog-guidance.mjs
          node tests/browser-audit.mjs
          node tests/browser-dashboard-polish.mjs
          node tests/browser-responsive-actions.mjs
          node tests/browser-allocation.mjs
          node tests/browser-avalanche-valuation.mjs
          node tests/browser-staking-coverage.mjs
          node tests/browser-staking-dialog-scope.mjs
          node tests/browser-modal-clarity.mjs
          node tests/browser-dialog-consistency.mjs
          node tests/browser-position-editor-ux.mjs
          node tests/browser-listing-review-clarity.mjs
          node tests/browser-dialog-visual.mjs
          node tests/browser-dialog-visual-regression.mjs
          node tests/browser-dialog-a11y-mobile.mjs
          node tests/browser-dialog-financial-choices.mjs
          node tests/browser-ledger-xpub.mjs
          node tests/browser-position-drilldown.mjs
          node tests/browser-historical-csv.mjs
          node tests/browser-crypto-history-resilience.mjs
          node tests/browser-etf-crypto-fallbacks.mjs
          node tests/browser-universal-security-discovery.mjs
          node tests/browser-onboarding-suggestions.mjs
          node tests/browser-account-opening.mjs
          node tests/browser-cash-reconciliation.mjs
          node tests/browser-cash-terms.mjs
          node tests/browser-interest-scenario.mjs
          node tests/browser-valuation-drilldown.mjs
          node tests/browser-settings-backup.mjs
          node tests/browser-corrupt-backup-restore.mjs
          node tests/browser-multitab-integrity.mjs
          node tests/browser-p0-storage.mjs
          node tests/browser-atomic-storage.mjs
          node tests/browser-idb-new-install.mjs
          node tests/browser-idb-migration-acceptance.mjs
          node tests/browser-idb-unmarked-recovery.mjs
          node tests/browser-idb-cutover.mjs
          node tests/browser-idb-migration-resilience.mjs
          node tests/browser-idb-crash-recovery.mjs
          node tests/browser-idb-concurrent-imports.mjs
          node tests/browser-idb-corrupt-recovery.mjs
          node tests/browser-key-privacy.mjs
          node tests/browser-solana-rpc-help.mjs
          node tests/browser-data-source-settings.mjs
          node tests/browser-eodhd-credentials.mjs
          node tests/browser-position-search.mjs
          node tests/browser-position-details.mjs
          node tests/browser-asset-wizard.mjs
          node tests/browser-ui07-audit.mjs
          node tests/browser-quality-review.mjs
          node tests/browser-annual-overview.mjs
          node tests/browser-transfer-matching.mjs
          node tests/browser-transfer-states.mjs
          node tests/browser-booking-history.mjs
          node tests/browser-booking-filters.mjs
          node tests/browser-dashboard-periods.mjs
          node tests/browser-chart-period-consistency.mjs
          node tests/browser-extended-chart-periods.mjs
          node tests/browser-provider-accordion.mjs
          node tests/browser-legacy-quotes-chevrons.mjs
          node tests/browser-public-instruments.mjs
          node tests/browser-account-deeplink.mjs
          node tests/browser-catalog-expansion.mjs
          node tests/browser-security-catalog.mjs
          node tests/browser-security-sources.mjs
          node tests/browser-eodhd-worker.mjs
          node tests/browser-market-diagnostics.mjs
          node tests/live-probes.mjs
          node tests/browser-accessibility-audit.mjs
          node tests/browser-portfolio-scale.mjs
          node tests/browser-offline-mobile.mjs
          node tests/browser-pwa-updates.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: error
      - name: Preserve representative dialog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-visual-reference
          path: |
            artifacts/dialog-visual/
            artifacts/dialog-visual-diff/
          if-no-files-found: ignore
  cross-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firefox and WebKit for cross-engine regression
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p artifacts/gates
          # Keep Ubuntu signatures/TLS verification; avoid the observed stalling Azure mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          npm install --no-save playwright@1.64.1 axe-core@4.10.3 2>&1 | tee artifacts/gates/flh03-browser-install.log
          DEBUG=pw:install npx playwright install --with-deps firefox webkit 2>&1 | tee -a artifacts/gates/flh03-browser-install.log
      - name: Test portfolio workflows on Firefox and WebKit
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-cross-browser.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          UI07_ENGINES=firefox,webkit node tests/browser-ui07-audit.mjs
          QUALITY_ENGINES=firefox,webkit node tests/browser-quality-review.mjs
          ANNUAL_ENGINES=firefox,webkit node tests/browser-annual-overview.mjs
          TRANSFER_ENGINES=firefox,webkit node tests/browser-transfer-matching.mjs
          TRANSFER_STATE_ENGINES=firefox,webkit node tests/browser-transfer-states.mjs
          FLH_ENGINES=firefox,webkit node tests/browser-booking-history.mjs
          node tests/browser-cross-engine.mjs
          FLH03_ENGINES=firefox,webkit node tests/browser-csv-batch.mjs
          FLH03_ABCE_ENGINES=firefox,webkit node tests/browser-flh03-abce.mjs
          FLH03_08_ENGINES=firefox,webkit node tests/browser-position-selection.mjs
          FLH03_08_ENGINES=firefox,webkit node tests/browser-position-removal.mjs
          ARCHIVE_ENGINES=firefox,webkit node tests/browser-position-archive.mjs
          UI_QUALITY_ENGINES=firefox,webkit node tests/browser-ui-quality.mjs
          CASH_ENGINES=firefox,webkit node tests/browser-cash-reconciliation.mjs
          TERM_ENGINES=firefox,webkit node tests/browser-cash-terms.mjs
          INTEREST_ENGINES=firefox,webkit node tests/browser-interest-scenario.mjs
          node tests/browser-atomic-storage-cross-engine.mjs
          IDB_ENGINES=firefox,webkit node tests/browser-idb-new-install.mjs
          IDB_ENGINES=firefox,webkit node tests/browser-idb-migration-acceptance.mjs
          IDB_ENGINES=firefox,webkit node tests/browser-idb-unmarked-recovery.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-wallet-history-core.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-bitcoin-history.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-ethereum-history.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-storage.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-ui.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-purchase-evidence.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-historical-position-value.mjs
          FLH02_ENGINES=firefox,webkit node tests/browser-flh02-release.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-worker.mjs
      - name: Preserve cross-engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engine-gates-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [test, cross-engine]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R index.html styles.css manifest.webmanifest sw.js src icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage and matching service-worker version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          expected="$(head -n 1 sw.js)"
          test -n "$expected"
          for attempt in $(seq 1 24); do
            homepage="$(curl -fsSL --connect-timeout 7 --max-time 15 "$base/" || true)"
            service_worker="$(curl -fsSL --connect-timeout 7 --max-time 15 "$base/sw.js" || true)"
            if [[ "$homepage" == *'FolioLab Open'* && "$service_worker" == *"$expected"* ]]; then
              echo "Published homepage and service worker verified: $base (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo 'Live deployment not verified: homepage or service-worker revision differs.' >&2
          exit 1


  live-acceptance:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACCEPTANCE_BASE: https://foliolab.unperfekt.at/
      UI_QUALITY_BASE: https://foliolab.unperfekt.at/
      TRANSFER_STATE_BASE: https://foliolab.unperfekt.at/
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Chromium acceptance tools
        run: |
          set -euo pipefail
          mkdir -p artifacts/gates
          npm install --no-save playwright@1.56.1 axe-core@4.10.3 pngjs@7.0.0 2>&1 | tee artifacts/gates/live-browser-install.log
          npx playwright install chromium --only-shell 2>&1 | tee -a artifacts/gates/live-browser-install.log
      - name: Verify published bytes, core flows and targeted UI in Chromium
        env:
          UI_QUALITY_SCREENSHOTS: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "LIVE_QA_SHA $RELEASE_SHA"
          node tests/browser-live-acceptance.mjs 2>&1 | tee artifacts/gates/production-core.log
          node tests/browser-ui-quality.mjs 2>&1 | tee artifacts/gates/production-ui-chromium.log
          cp artifacts/gates/ui-quality.json artifacts/gates/production-ui-chromium.json
          node tests/browser-transfer-states.mjs 2>&1 | tee artifacts/gates/production-transfers-chromium.log
          cp artifacts/gates/transfer-states.json artifacts/gates/production-transfers-chromium.json
      - name: Install Firefox and WebKit for cross-engine regression
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p artifacts/gates
          # Keep Ubuntu signatures/TLS verification; avoid the observed stalling Azure mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          npm install --no-save playwright@1.64.1 axe-core@4.10.3 2>&1 | tee artifacts/gates/flh03-browser-install.log
          DEBUG=pw:install npx playwright install --with-deps firefox webkit 2>&1 | tee -a artifacts/gates/flh03-browser-install.log
      - name: Verify targeted production UI in Firefox and WebKit
        env:
          UI_QUALITY_ENGINES: firefox,webkit
          TRANSFER_STATE_ENGINES: firefox,webkit
        run: |
          set -euo pipefail
          node tests/browser-ui-quality.mjs 2>&1 | tee artifacts/gates/production-ui-cross.log
          cp artifacts/gates/ui-quality.json artifacts/gates/production-ui-cross.json
          node tests/browser-transfer-states.mjs 2>&1 | tee artifacts/gates/production-transfers-cross.log
          cp artifacts/gates/transfer-states.json artifacts/gates/production-transfers-cross.json
      - name: Expose bounded synthetic screenshots for visual review
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const files=[['c1-no-cash','artifacts/gates/c1-no-cash-account.png'],['c1-cash-no-out','artifacts/gates/c1-cash-without-outgoing.png'],['c2-history-records','artifacts/gates/ui-history-records-390.png'],['c2-history-partial','artifacts/gates/ui-history-partial-390.png'],['c3-history-quantity','artifacts/gates/ui-history-quantity-390.png']];
          for(const [id,path]of files){
            const bytes=readFileSync(path);
            if(bytes.length>256000)throw Error('Synthetic screenshot exceeds bounded review payload');
            const data=bytes.toString('base64');
            console.log('LIVE_IMAGE_BEGIN '+JSON.stringify({id,path,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),release:process.env.RELEASE_SHA}));
            for(let offset=0;offset<data.length;offset+=4000)console.log('LIVE_IMAGE_CHUNK '+id+' '+offset/4000+' '+data.slice(offset,offset+4000));
            console.log('LIVE_IMAGE_END '+id);
          }
          JS
      - name: Preserve actual production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-acceptance-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: error
          retention-days: 7
