name: Cloudflare Worker – Test und manuelles Deployment

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foliolab-open-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker-tests:
    name: Worker-Syntax und Unit-Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker-JavaScript validieren
        run: |
          set -euo pipefail
          for file in worker/src/*.js; do node --check "$file"; done
      - name: Worker-Vertragstests ausführen
        run: node --test worker/tests/*.test.mjs

  worker-deploy:
    name: Worker manuell veröffentlichen und prüfen
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: worker-tests
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-worker-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare-Zugangsdaten vorhanden
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN fehlt (GitHub Secret)." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID fehlt (GitHub Secret)." >&2; exit 1; }
      - name: Worker über Wrangler veröffentlichen
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: HTTPS und restriktives CORS live prüfen
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = process.env.WORKER_URL;
          assert.ok(base, 'Keine Deployment-URL von Wrangler erhalten');
          assert.equal(new URL(base).protocol, 'https:', 'Nur HTTPS erlaubt');
          const origin = 'https://joke0071.github.io';
          const url = new URL('/api/instruments/search', base);
          const allowed = await fetch(url, {
            method: 'OPTIONS',
            headers: { origin, 'access-control-request-method': 'GET' }
          });
          assert.equal(allowed.status, 204, 'Preflight schlägt fehl');
          assert.equal(allowed.headers.get('access-control-allow-origin'), origin, 'Frontend-Origin fehlt');
          const forbidden = await fetch(url, {
            headers: { origin: 'https://untrusted.example' }
          });
          assert.equal(forbidden.status, 403, 'Unbekannte Browser-Origin wurde nicht abgewiesen');
          console.log('Cloudflare-Worker geprüft: '+base);
          NODE
      - name: URL in der Job-Zusammenfassung anzeigen
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## Cloudflare Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy und Origin-Prüfung erfolgreich: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Für EODHD sind zusätzlich die Cloudflare-Worker-Secrets EODHD_TOKEN und MARKET_ACCESS_TOKEN notwendig." >> "$GITHUB_STEP_SUMMARY"
