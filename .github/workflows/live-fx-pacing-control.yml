name: SW321 bounded FX cold-context pacing comparison
on:
  pull_request:
    branches: [feature/flh05-import-foundation]
    paths:
      - '.github/workflows/live-fx-pacing-control.yml'
      - 'tests/diagnostics/run-fx-pacing-control.mjs'
      - 'tests/diagnostics/fx-age-paced-candidate.mjs'
permissions:
  contents: read
jobs:
  fx-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FOLIOLAB_PRODUCT_SHA: 494ed8f0f6b627d8be972a5ceb886005e5064b31
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 494ed8f0f6b627d8be972a5ceb886005e5064b31
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: foliolab-pw1.56.1-chromium-shell-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install existing pinned Chromium automation
        working-directory: app
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: One baseline and one paced original FX suite sequentially
        working-directory: app
        env:
          FOLIOLAB_QA_ROOT: ${{ github.workspace }}/qa
          FOLIOLAB_OUTPUT: ${{ github.workspace }}/fx-control-evidence
        run: node ../qa/tests/diagnostics/run-fx-pacing-control.mjs
      - name: Preserve both original responses cases and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw321-fx-pacing-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: fx-control-evidence/
          if-no-files-found: error
          retention-days: 30
