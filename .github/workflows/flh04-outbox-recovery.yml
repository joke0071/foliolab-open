name: FLH04 local outbox recovery
on:
  pull_request:
    branches: [feature/flh04-revisions-20261113-b5ddfe1c]
permissions:
  contents: read
jobs:
  outbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all portfolio, sync and worker contracts
        run: |
          npm run check
          npm test
      - name: Load the pre-handoff archive client for the upgrade test
        uses: actions/checkout@v4
        with:
          ref: b6b5678abcac780ef2db47b00565319215107552
          path: flh04-previous
          persist-credentials: false
          sparse-checkout: |
            src
            experimental/sync
      - name: Install pinned Chromium harness
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx --no-install playwright install chromium --only-shell
      - name: Exercise renderer and browser restart, recovery and storage-version fences
        env:
          ENGINE: chromium
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/flh04-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4173/tests/storage-origin.html | cmp - tests/storage-origin.html
          kill -0 "$server"
          ulimit -c 0
          FLH04_BROWSER_PROCESS_RESTART=1 FLH04_SOURCE_LIFECYCLE=1 FLH04_RENDERER_TERMINATION=1 timeout --kill-after=10s 360s node tests/browser-sync-outbox.mjs
          FLH04_VERSION2_CANDIDATE=1 timeout --kill-after=10s 360s node tests/browser-sync-outbox.mjs
          timeout --kill-after=10s 90s node tests/browser-flh04-locked-anchor.mjs
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: foliolab-pw1.64.1-firefox-webkit-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install existing Firefox and WebKit acceptance versions
        run: |
          set -euo pipefail
          for entry in 'archive apt-mirrors.txt' 'security apt-mirrors-security.txt'; do
            read -r kind file <<< "$entry"
            if [[ -f "/etc/apt/$file" ]]; then
              mirror="$(bash tools/select-ubuntu-mirror.sh "$kind" noble)"
              printf '%s\n' "$mirror" | sudo tee "/etc/apt/$file" >/dev/null
            fi
          done
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          npx --no-install playwright install --with-deps firefox webkit
      - name: Load the pre-handoff archive client for the upgrade test
        uses: actions/checkout@v4
        with:
          ref: b6b5678abcac780ef2db47b00565319215107552
          path: flh04-previous
          persist-credentials: false
          sparse-checkout: |
            src
            experimental/sync
      - name: Verify local outbox, key persistence and conflicting edits on both engines
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/flh04-portable-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4173/tests/storage-origin.html | cmp - tests/storage-origin.html
          kill -0 "$server"
          for engine in firefox webkit; do
            ENGINE="$engine" FLH04_PORTABLE=1 timeout --kill-after=10s 180s node tests/browser-sync-outbox.mjs
            ENGINE="$engine" timeout --kill-after=10s 90s node tests/browser-flh04-locked-anchor.mjs
          done
