name: Wallet scan checks
on:
  push:
    branches:
      - fix/sonic-benqi-solana-staking-wallet-scan
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm test
