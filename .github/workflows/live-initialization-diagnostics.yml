name: Bounded live initialization diagnostics
on:
  create:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-initialization-diagnostics.yml'
      - 'tests/browser-failure-diagnostics.mjs'
      - 'tests/browser-chart-tooltip.mjs'
      - 'tests/browser-reference-management.mjs'
      - 'tests/browser-pchain-evidence.mjs'
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.head_ref == 'test/v220-live-initialization-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UI_QUALITY_BASE: https://foliolab.unperfekt.at/
      UI_QUALITY_ENGINES: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing acceptance tools
        run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install chromium --only-shell
      - name: Capture published identity
        run: |
          mkdir -p artifacts/gates
          curl --fail --silent --show-error https://foliolab.unperfekt.at/sw.js > artifacts/gates/diagnostic-published-sw.js
          sha256sum artifacts/gates/diagnostic-published-sw.js
          head -n 1 artifacts/gates/diagnostic-published-sw.js
      - name: One unchanged chart gate with failure evidence
        run: node tests/browser-chart-tooltip.mjs
      - name: One unchanged reference gate with failure evidence
        if: always()
        run: node tests/browser-reference-management.mjs
      - name: Reproduce the original complete Chromium UI suite with failure evidence
        if: always()
        env:
          UI_QUALITY_SCREENSHOTS: '1'
        run: node tests/browser-ui-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-live-initialization-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: error
          retention-days: 7

  pchain-diagnostic:
    if: github.head_ref == 'test/v221-live-pchain-initialization-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    env:
      PCHAIN_BASE: https://foliolab.unperfekt.at/
      PCHAIN_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching cross-engine acceptance tools
        run: |
          npm install --no-save playwright@1.64.1 axe-core@4.10.3
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify unchanged published v221 worker identity
        run: |
          set -euo pipefail
          mkdir -p artifacts/gates
          curl --fail --silent --show-error https://foliolab.unperfekt.at/sw.js > artifacts/gates/diagnostic-published-sw.js
          cmp sw.js artifacts/gates/diagnostic-published-sw.js
          sha256sum artifacts/gates/diagnostic-published-sw.js
          head -n 1 artifacts/gates/diagnostic-published-sw.js
      - name: One original P-Chain gate with startup failure evidence
        run: node tests/browser-pchain-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-v221-pchain-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/gates/
          if-no-files-found: error
          retention-days: 7

  flh04-c1-native-correction-first:
    if: github.event_name == 'create' && github.event.ref_type == 'branch' && github.ref == 'refs/heads/test/flh04-c1-correction-bfed8172-366da675bef5' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      C1_SOURCE_SHA: bfed81728189c71ff88c7a7419f2c51db56b084d
      C1_SOURCE_TREE: 27dad342d21e45b484c7b8ab87d4ed7cc2851b46
      C1_OUT_DIR: artifacts/flh04-c1
      ENGINE: chromium
      FLH04_VERSION2_CANDIDATE: '1'
      BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact execution commit and its source parent
        uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select previously used Node version
        uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.4'
      - name: Bind execution workflow and unchanged C1 source
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$C1_OUT_DIR/inputs"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$C1_SOURCE_SHA"
          cp .github/workflows/live-initialization-diagnostics.yml "$C1_OUT_DIR/executed-workflow.yml"
          git diff --name-only "$C1_SOURCE_SHA" "$GITHUB_SHA" > "$C1_OUT_DIR/execution-delta.txt"
          python3 - <<'PY'
          import os, pathlib
          out=pathlib.Path(os.environ['C1_OUT_DIR'])
          assert (out/'execution-delta.txt').read_text().splitlines()==['.github/workflows/live-initialization-diagnostics.yml']
          PY
          git checkout --detach "$C1_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$C1_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$C1_SOURCE_TREE"
          git ls-tree -r HEAD > "$C1_OUT_DIR/pinned-source-tree.txt"
          cp --parents package.json tests/browser-sync-outbox.mjs src/browser-portfolio-storage.js tests/flh04-version2-candidate-probes.mjs tests/flh04-c1-diagnostics.mjs tests/flh04-c1-source-guard.test.mjs tests/flh04-c1-diagnostics.test.mjs tests/fixtures/c1-storage-dependencies.mjs tests/storage-origin.html "$C1_OUT_DIR/inputs/"
          node --version > "$C1_OUT_DIR/node.txt"
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          out=pathlib.Path(os.environ['C1_OUT_DIR'])
          expected={"tests/browser-sync-outbox.mjs":"f5d6bcab636ff8b9cf5d4b62514dcb98acb2475c","src/browser-portfolio-storage.js":"ce56e74ff0519331b06e9833ab808e17a136613f","tests/flh04-version2-candidate-probes.mjs":"d87ab642d1ba409814af517c2b28ad50fd924b0c","tests/flh04-c1-diagnostics.mjs":"1e1f5c3bbe66d911a312c246b98f08f11562c4af","tests/flh04-c1-source-guard.test.mjs":"33eeaabce0cebac36fc46592ce2c5bede68e6c26","tests/flh04-c1-diagnostics.test.mjs":"eb53397ca3d6d2aab127b53583408e8402719cc8","tests/fixtures/c1-storage-dependencies.mjs":"02c53fa3c41ff35785021757ceb43eb834dc4b60"}
          files=[]
          for name,want in expected.items():
           data=pathlib.Path(name).read_bytes()
           actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
           assert actual==want,(name,actual)
           files.append({'path':name,'bytes':len(data),'git_blob_sha1':actual})
          fields=['GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','RUNNER_OS','RUNNER_ARCH','C1_SOURCE_SHA','C1_SOURCE_TREE','ENGINE','FLH04_VERSION2_CANDIDATE','BASE_URL']
          receipt={name:os.environ.get(name) for name in fields}
          receipt['files']=files
          receipt['limits']={'job_minutes':25,'harness_seconds':360,'harness_calls':1,'engines':['chromium'],'automatic_test_retries':0}
          (out/'source-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Install pinned existing browser tool without package scripts
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 2>&1 | tee "$C1_OUT_DIR/install.log"
      - name: Install the previously used Chromium shell
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install chromium --only-shell 2>&1 | tee "$C1_OUT_DIR/browser-install.log"
          node --input-type=module <<'JS' > "$C1_OUT_DIR/runtime.json"
          import {createRequire} from 'node:module';
          import {chromium} from 'playwright';
          const require=createRequire(import.meta.url);
          console.log(JSON.stringify({node:process.version,playwright:require('playwright/package.json').version,
           executable:chromium.executablePath(),browserStarted:false},null,2));
          JS
      - name: One original harness call with the C1 extension
        id: c1
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$C1_OUT_DIR/http.log" 2>&1 &
          c1_http_pid=$!
          trap 'kill "$c1_http_pid" 2>/dev/null || true; wait "$c1_http_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const expected=readFileSync('tests/storage-origin.html');
          let ready=false;
          for(let index=0;index<50;index++){
           try{
            const response=await fetch('http://127.0.0.1:4173/tests/storage-origin.html');
            if(response.ok&&Buffer.from(await response.arrayBuffer()).equals(expected)){ready=true;break;}
           }catch{}
           await new Promise(resolve=>setTimeout(resolve,100));
          }
          if(!ready)throw Error('Exact local test origin not ready');
          JS
          kill -0 "$c1_http_pid"
          set +e
          timeout --signal=TERM --kill-after=15s 360s node tests/browser-sync-outbox.mjs 2>&1 | tee "$C1_OUT_DIR/test.log"
          c1_pipe_status=("${PIPESTATUS[@]}")
          set -e
          c1_test_status="${c1_pipe_status[0]}"
          c1_log_status="${c1_pipe_status[1]}"
          C1_TEST_STATUS="$c1_test_status" C1_LOG_STATUS="$c1_log_status" python3 - <<'PY'
          import os,json,pathlib
          out=pathlib.Path(os.environ['C1_OUT_DIR'])
          (out/'exit-status.json').write_text(json.dumps({
           'test_exit':int(os.environ['C1_TEST_STATUS']),
           'tee_exit':int(os.environ['C1_LOG_STATUS'])
          },indent=2)+'\n')
          PY
          if [ "$c1_log_status" -ne 0 ]; then exit "$c1_log_status"; fi
          exit "$c1_test_status"
      - name: Preserve observed results without reclassifying failures
        if: always()
        timeout-minutes: 1
        env:
          C1_STEP_OUTCOME: ${{ steps.c1.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$C1_OUT_DIR"
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          out=pathlib.Path(os.environ['C1_OUT_DIR'])
          log=out/'test.log'
          reports=[]
          if log.exists():
           for line in log.read_text(errors='replace').splitlines():
            if line.startswith('{"kind":"FLH04Version2CandidateProbe"'):
             try: reports.append(json.loads(line))
             except json.JSONDecodeError: pass
          observed=reports[0] if len(reports)==1 else None
          summary={
           'source_sha':os.environ['C1_SOURCE_SHA'],
           'source_tree':os.environ['C1_SOURCE_TREE'],
           'execution_sha':os.environ.get('GITHUB_SHA'),
           'run_id':os.environ.get('GITHUB_RUN_ID'),
           'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
           'test_step_outcome':os.environ.get('C1_STEP_OUTCOME'),
           'report_count':len(reports),
           'source_receipt_available':(out/'source-receipt.json').exists(),
           'exit_status':json.loads((out/'exit-status.json').read_text()) if (out/'exit-status.json').exists() else None,
           'c1_report':observed,
           'report_status':'OBSERVED' if observed is not None else 'NOT_REACHED_OR_NO_VALID_REPORT',
           'prior_failed_groups':['C1-MARKERS','C1-NO-REVERT'],
           'c1_cases':observed.get('cases',[]) if observed is not None else [{'id':name,'status':'NOT_REACHED'} for name in ['C1-CANCEL','C1-VERSION-FENCE','C1-MARKERS','C1-NO-REVERT','C1-RESTORE-CAS','C1-RESTORE-FAULT-REPLY']],
           'expected_failures_count_as_pass':False,
           'scope':'Original browser-sync-outbox baseline plus six C1 groups, one invocation, Chromium only',
           'not_qualified':['production v2 adapter','full writer closure','real process crash','real quota','crypto review','active sync']
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          files=[]
          for file in sorted(out.rglob('*')):
           if file.is_file() and file.name!='artifact-manifest.json':
            data=file.read_bytes()
            files.append({'path':file.relative_to(out).as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'artifact-manifest.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - name: Upload original C1 evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: flh04-c1-correction-bfed8172-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/flh04-c1/
          if-no-files-found: error
          retention-days: 7
