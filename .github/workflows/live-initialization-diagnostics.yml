name: Bounded seven-fix native diagnostics
on:
  create:
permissions:
  contents: read
jobs:
  seven-native:
    if: github.event.ref_type == 'branch' && github.ref == 'refs/heads/test/seven-native-77bcb76dd357-initial-20261114' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FOLIOLAB_TEST_SHA: 76b198e6a26fdb56b6d6e05bd5fb19e4101afcde
      SOURCE_TREE: ae95f5f2d7a04737482a98eafa6f5d5907df9266
      PRODUCT_SHA: 883c4eb0e8137040a9f6bfd2e193bc5833aac0c2
      PRODUCT_TREE: 9ad46b9ee8b6039f49ddf23b2655227b493692f4
      BROWSER: chromium
      OUT: artifacts/seven-native-host
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with:
          node-version: '22.23.4'
      - name: Bind unchanged candidate and execution delta
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p "$OUT"
          echo '{"kind":"BEGIN","scope":"seven serial corrections"}' | tee "$OUT/host.jsonl"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$FOLIOLAB_TEST_SHA"
          cp .github/workflows/live-initialization-diagnostics.yml "$OUT/executed-workflow.yml"
          git diff --name-only HEAD^ HEAD > "$OUT/execution-delta.txt"
          test "$(cat "$OUT/execution-delta.txt")" = ".github/workflows/live-initialization-diagnostics.yml"
          git checkout --detach "$FOLIOLAB_TEST_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^^{tree})" = "$PRODUCT_TREE"
          git diff --name-only HEAD^ HEAD > "$OUT/test-source-delta.txt"
          python3 - <<'PY_CHECK'
          import pathlib
          got=set(pathlib.Path('artifacts/seven-native-host/test-source-delta.txt').read_text().splitlines())
          assert got=={'tests/browser-seven-native.mjs','docs/release-evidence/seven-native-contract-2026-11-14.json'},got
          PY_CHECK
          git ls-tree -r HEAD > "$OUT/source-tree.txt"
          git archive HEAD index.html styles.css src icons manifest.webmanifest tests/browser-seven-native.mjs tests/storage-origin.html docs/release-evidence/seven-native-contract-2026-11-14.json package.json sw.js > "$OUT/source-inputs.tar"
          node --version > "$OUT/node.txt"
          echo '{"kind":"STAGE","name":"source-bound"}' | tee -a "$OUT/host.jsonl"
      - name: Install existing pinned acceptance tools
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 2>&1 | tee "$OUT/install.log"
          npx --no-install playwright install chromium --only-shell 2>&1 | tee "$OUT/browser-install.log"
          node --input-type=module -e 'import {createRequire} from "node:module"; const r=createRequire(import.meta.url); console.log(JSON.stringify({node:process.version,playwright:r("playwright/package.json").version}))' > "$OUT/runtime.json"
          echo '{"kind":"STAGE","name":"tools-ready"}' | tee -a "$OUT/host.jsonl"
      - name: One independent three-group harness within 360 seconds
        id: probe
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$OUT/http.log" 2>&1 &
          ui_http_pid=$!
          cleanup_origin() {
            kill "$ui_http_pid" 2>/dev/null || true
            wait "$ui_http_pid" 2>/dev/null || true
            if kill -0 "$ui_http_pid" 2>/dev/null; then
              echo '{"local_origin_cleanup":"FAIL"}' > "$OUT/cleanup.json"
            else
              echo '{"local_origin_cleanup":"PASS"}' > "$OUT/cleanup.json"
            fi
          }
          trap cleanup_origin EXIT
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const expected=readFileSync('index.html');
          let ready=false;
          for(let i=0;i<50;i++){
            try{const r=await fetch('http://127.0.0.1:4173/');if(r.ok&&Buffer.from(await r.arrayBuffer()).equals(expected)){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,100));
          }
          if(!ready)throw Error('Exact synthetic local origin unavailable');
          JS
          kill -0 "$ui_http_pid"
          echo '{"kind":"STAGE","name":"harness-start"}' | tee -a "$OUT/host.jsonl"
          set +e
          timeout --signal=TERM --kill-after=15s 360s node tests/browser-seven-native.mjs 2>&1 | tee "$OUT/test.log"
          ui_pipe_status=("${PIPESTATUS[@]}")
          set -e
          printf '{"kind":"RESULT","test_exit":%s,"tee_exit":%s}\n' "${ui_pipe_status[0]}" "${ui_pipe_status[1]}" | tee -a "$OUT/host.jsonl" > "$OUT/exit-status.json"
          if [ "${ui_pipe_status[1]}" -ne 0 ]; then exit "${ui_pipe_status[1]}"; fi
          exit "${ui_pipe_status[0]}"
      - name: Preserve observed status and exact manifest
        if: always()
        timeout-minutes: 1
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import pathlib,os,json,hashlib
          out=pathlib.Path(os.environ['OUT'])
          report=pathlib.Path('artifacts/seven-native/report.json')
          summary={k:os.environ.get(k) for k in ['GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','FOLIOLAB_TEST_SHA','SOURCE_TREE','PRODUCT_SHA','PRODUCT_TREE','PROBE_OUTCOME','RUNNER_OS','RUNNER_ARCH']}
          try:
            summary['report']=json.loads(report.read_text()) if report.exists() else None
            summary['report_status']='OBSERVED' if report.exists() else 'NO_VALID_REPORT'
          except Exception as error:
            summary['report']=None
            summary['report_status']='INVALID_REPORT'
            summary['report_error']=str(error)
          summary['limits']={'job_minutes':25,'harness_seconds':360,'kill_after_seconds':15,'engines':['chromium'],'harness_calls':1,'retry':0}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          entries=[]
          for p in sorted(pathlib.Path('artifacts').rglob('*')):
            if p.is_file() and p.name!='manifest.json':
              data=p.read_bytes();entries.append({'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'manifest.json').write_text(json.dumps(entries,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: seven-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

