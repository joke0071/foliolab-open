    - name: Restore pinned Firefox/WebKit cache (integration)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: foliolab-pw1.64.1-firefox-webkit-v1-${{ runner.os }}-${{ runner.arch }}
    - name: Install Firefox and WebKit for cross-engine regression
      timeout-minutes: 8
      run: |
        set -euo pipefail
        mkdir -p artifacts/gates
        # Probe bounded HTTPS Ubuntu alternatives before changing either mirror list.
        archive_mirror=''
        security_mirror=''
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          archive_mirror="$(bash tools/select-ubuntu-mirror.sh archive noble)"
        fi
        if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
          security_mirror="$(bash tools/select-ubuntu-mirror.sh security noble)"
        fi
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf '%s\n' "$archive_mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
          printf '%s\n' "$security_mirror" | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
        fi
        npm install --no-save playwright@1.64.1 axe-core@4.10.3 2>&1 | tee artifacts/gates/flh03-browser-install.log
        DEBUG=pw:install npx playwright install --with-deps firefox webkit 2>&1 | tee -a artifacts/gates/flh03-browser-install.log
    - name: Test portfolio workflows on Firefox and WebKit
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-cross-browser.log 2>&1 &
        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
        UI_QUALITY_ENGINES=firefox,webkit node tests/browser-ui-quality.mjs
    - name: Preserve cross-engine evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b1-ui-quality-cross
        path: artifacts/gates/
        if-no-files-found: error
        retention-days: 7
    name: b1 / quality_cross
  a1_plan:
    name: a1 / plan
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      full: ${{ steps.stage.outputs.full }}
      css: ${{ steps.stage.outputs.css }}
      ci_contract: ${{ steps.stage.outputs.ci_contract }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - id: stage
      name: Classify exact base/head changes conservatively
      run: node tests/ci-stage-plan.mjs
    - name: Preserve explicit stage and impact receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: a1-ci-stage-${{ github.sha }}
        path: artifacts/ci-stage/
        if-no-files-found: error
        retention-days: 7
    needs:
    - b1_test
    - b1_cross
    - b1_wallet
    - b1_quality_chromium
    - b1_quality_cross
  a1_test:
    needs:
    - a1_plan
    if: needs.a1_plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_id: ${{ steps.pages_upload.outputs.artifact_id }}
      pages_artifact_attempt: ${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Require a service-worker cache revision for shipped asset changes
      run: |
        set -euo pipefail
        if git diff --quiet HEAD^ HEAD -- index.html styles.css manifest.webmanifest src icons; then
          echo 'No shipped application assets changed; cache revision unchanged is allowed.'
          exit 0
        fi
        previous="$(git show HEAD^:sw.js | grep '^const CACHE=' || true)"
        current="$(grep '^const CACHE=' sw.js || true)"
        if [[ -z "$previous" || -z "$current" || "$previous" == "$current" ]]; then
          echo 'Shipped app assets changed without a new PWA cache revision.' >&2
          exit 1
        fi
        echo "PWA cache revision changed: $previous -> $current"
