name: SW347 paired integration timing with two isolated UI quality jobs
'on':
  push:
    branches:
    - measure/sw347-ui-quality-isolation
permissions:
  contents: read
jobs:
  b1_plan:
    name: b1 / plan
    runs-on: ubuntu-24.04
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      full: ${{ steps.stage.outputs.full }}
      css: ${{ steps.stage.outputs.css }}
      ci_contract: ${{ steps.stage.outputs.ci_contract }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - id: stage
      name: Classify exact base/head changes conservatively
      run: node tests/ci-stage-plan.mjs
    - name: Preserve explicit stage and impact receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b1-ci-stage-${{ github.sha }}
        path: artifacts/ci-stage/
        if-no-files-found: error
        retention-days: 7
  b1_test:
    needs:
    - b1_plan
    if: needs.b1_plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_id: ${{ steps.pages_upload.outputs.artifact_id }}
      pages_artifact_attempt: ${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Require a service-worker cache revision for shipped asset changes
      run: |
        set -euo pipefail
        if git diff --quiet HEAD^ HEAD -- index.html styles.css manifest.webmanifest src icons; then
          echo 'No shipped application assets changed; cache revision unchanged is allowed.'
          exit 0
        fi
        previous="$(git show HEAD^:sw.js | grep '^const CACHE=' || true)"
        current="$(grep '^const CACHE=' sw.js || true)"
        if [[ -z "$previous" || -z "$current" || "$previous" == "$current" ]]; then
          echo 'Shipped app assets changed without a new PWA cache revision.' >&2
          exit 1
        fi
        echo "PWA cache revision changed: $previous -> $current"
    - name: Prepare static site
      run: |
        set -euo pipefail
        mkdir -p _site
        cp -R index.html styles.css manifest.webmanifest sw.js LICENSE src icons _site/
        cmp LICENSE _site/LICENSE
    - id: pages_upload
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages-attempt-${{ github.run_attempt }}
        path: _site
    - name: Verify standalone application
      run: |
        set -euo pipefail
        mkdir -p artifacts/gates
        git rev-parse HEAD > artifacts/gates/tested-sha.txt
        npm test 2>&1 | tee artifacts/gates/unit.log
        npm run check 2>&1 | tee artifacts/gates/syntax.log
    - name: Restore pinned Chromium shell cache (integration)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: foliolab-pw1.56.1-chromium-shell-v1-${{ runner.os }}-${{ runner.arch }}
    - name: Install browser test tools
      run: |
        npm install --no-save playwright@1.56.1 axe-core@4.10.3 pngjs@7.0.0
        npx playwright install chromium --only-shell
    - name: Browser smoke tests (320–1440 px)
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-http.log 2>&1 &
        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
        node tests/browser-cash-account-ux.mjs
        node tests/browser-etf-source-recovery.mjs
        node tests/browser-smoke.mjs
        node tests/browser-loading-pwa.mjs
        node tests/browser-ui-alltag10.mjs
        node tests/browser-ui-textscale.mjs
        node tests/browser-price-csv-tools.mjs
        node tests/browser-pwa-update.mjs
        node tests/browser-extended.mjs
        node tests/browser-ledger.mjs
        node tests/browser-phase2.mjs
        node tests/browser-phase3.mjs
        node tests/browser-wallet-history-core.mjs
        node tests/browser-pchain-evidence.mjs
        node tests/browser-sonic-staking-evidence.mjs
        node tests/browser-bitcoin-history.mjs
        node tests/browser-ethereum-history.mjs
