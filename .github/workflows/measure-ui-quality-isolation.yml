        node-version: '22'
    - name: Restore pinned Chromium shell cache (integration)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: foliolab-pw1.56.1-chromium-shell-v1-${{ runner.os }}-${{ runner.arch }}
    - name: Install browser test tools
      run: |
        npm install --no-save playwright@1.56.1 axe-core@4.10.3 pngjs@7.0.0
        npx playwright install chromium --only-shell
    - name: Browser smoke tests (320–1440 px)
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-http.log 2>&1 &
        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
        UI_QUALITY_SCREENSHOTS=1 node tests/browser-ui-quality.mjs
    - name: Expose bounded synthetic C5 PR review
      run: |
        set -euo pipefail
        node --input-type=module <<'JS'
        import {readFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        const files=[['c5-positions','artifacts/gates/ui-positions-390.png'],['c5-bookings','artifacts/gates/c5-bookings-390.png'],['c5-connections','artifacts/gates/c5-connections-390.png'],['c5-connections-viewport','artifacts/gates/c5-connections-viewport-390.png']];
        for(const [id,path]of files){
          const bytes=readFileSync(path);
          if(bytes.length>256000)throw Error('Synthetic screenshot exceeds bounded review payload');
          const data=bytes.toString('base64');
          console.log('LIVE_IMAGE_BEGIN '+JSON.stringify({id,path,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),release:process.env.GITHUB_SHA}));
          for(let offset=0;offset<data.length;offset+=4000)console.log('LIVE_IMAGE_CHUNK '+id+' '+offset/4000+' '+data.slice(offset,offset+4000));
          console.log('LIVE_IMAGE_END '+id);
        }
        JS
    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b1-ui-quality-chromium
        path: artifacts/gates/
        if-no-files-found: error
        retention-days: 7
    name: b1 / quality_chromium
  b1_quality_cross:
