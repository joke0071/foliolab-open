    - name: Preserve representative dialog screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b1-dialog-visual-reference
        path: |
          artifacts/dialog-visual/
          artifacts/dialog-visual-diff/
        if-no-files-found: ignore
