    name: b1 / test
  b1_cross:
    needs:
    - b1_plan
    if: needs.b1_plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore pinned Firefox/WebKit cache (integration)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: foliolab-pw1.64.1-firefox-webkit-v1-${{ runner.os }}-${{ runner.arch }}
    - name: Install Firefox and WebKit for cross-engine regression
      timeout-minutes: 8
      run: |
        set -euo pipefail
        mkdir -p artifacts/gates
        # Probe bounded HTTPS Ubuntu alternatives before changing either mirror list.
        archive_mirror=''
        security_mirror=''
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          archive_mirror="$(bash tools/select-ubuntu-mirror.sh archive noble)"
        fi
        if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
          security_mirror="$(bash tools/select-ubuntu-mirror.sh security noble)"
        fi
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf '%s\n' "$archive_mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        if [[ -f /etc/apt/apt-mirrors-security.txt ]]; then
          printf '%s\n' "$security_mirror" | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
        fi
        npm install --no-save playwright@1.64.1 axe-core@4.10.3 2>&1 | tee artifacts/gates/flh03-browser-install.log
        DEBUG=pw:install npx playwright install --with-deps firefox webkit 2>&1 | tee -a artifacts/gates/flh03-browser-install.log
    - name: Test portfolio workflows on Firefox and WebKit
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foliolab-cross-browser.log 2>&1 &
        for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
        if [[ "${{ matrix.shard }}" == "1" ]]; then
          UI07_ENGINES=firefox,webkit node tests/browser-ui07-audit.mjs
          UI_ENGINES=firefox,webkit node tests/browser-ui-alltag10.mjs
          UI_ENGINES=firefox,webkit node tests/browser-ui-textscale.mjs
          UI_ENGINES=firefox,webkit node tests/browser-price-csv-tools.mjs
          QUALITY_ENGINES=firefox,webkit node tests/browser-quality-review.mjs
          ANNUAL_ENGINES=firefox,webkit node tests/browser-annual-overview.mjs
          TRANSFER_ENGINES=firefox,webkit node tests/browser-transfer-matching.mjs
          TRANSFER_STATE_ENGINES=firefox,webkit node tests/browser-transfer-states.mjs
          FLH03_ENGINES=firefox,webkit node tests/browser-csv-batch.mjs
          FLH03_08_ENGINES=firefox,webkit node tests/browser-position-selection.mjs
          ARCHIVE_ENGINES=firefox,webkit node tests/browser-position-archive.mjs
          BOOKING_MANAGEMENT_ENGINES=firefox,webkit node tests/browser-booking-management.mjs
          TERM_ENGINES=firefox,webkit node tests/browser-cash-terms.mjs
          node tests/browser-atomic-storage-cross-engine.mjs
          UI_PERIOD_ENGINE=firefox node tests/browser-chart-period-consistency.mjs
          UI_PERIOD_ENGINE=firefox node tests/browser-extended-chart-periods.mjs
          UI_PERIOD_ENGINE=webkit node tests/browser-chart-period-consistency.mjs
          UI_PERIOD_ENGINE=webkit node tests/browser-extended-chart-periods.mjs
          IDB_ENGINES=firefox,webkit node tests/browser-idb-unmarked-recovery.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-wallet-history-core.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-ethereum-history.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-ui.mjs
        elif [[ "${{ matrix.shard }}" == "2" ]]; then
          CASH_UX_ENGINES=firefox,webkit node tests/browser-cash-account-ux.mjs
          ETF_SOURCE_ENGINES=firefox,webkit node tests/browser-etf-source-recovery.mjs
          LOADING_ENGINES=firefox,webkit node tests/browser-loading-pwa.mjs
          PWA_UPDATE_ENGINES=firefox,webkit node tests/browser-pwa-update.mjs
          FLH_ENGINES=firefox,webkit node tests/browser-booking-history.mjs
          node tests/browser-cross-engine.mjs
          RECOVERY_ENGINES=firefox,webkit node tests/browser-recovery-backup-limits.mjs
          FIN_E2E_ENGINES=firefox,webkit node tests/browser-fin-e2e.mjs
          PCHAIN_ENGINES=firefox,webkit node tests/browser-pchain-evidence.mjs
          SONIC_EVIDENCE_ENGINES=firefox,webkit node tests/browser-sonic-staking-evidence.mjs
          FLH03_ABCE_ENGINES=firefox,webkit node tests/browser-flh03-abce.mjs
          DIALOG_NATIVE_ENGINES=firefox,webkit node tests/browser-dialog-native-navigation.mjs
          RESTORE_ENGINES=firefox,webkit node tests/browser-restore-deposits.mjs
          FLH03_08_ENGINES=firefox,webkit node tests/browser-position-removal.mjs
        else
          CASH_ENGINES=firefox,webkit node tests/browser-cash-reconciliation.mjs
          INTEREST_ENGINES=firefox,webkit node tests/browser-interest-scenario.mjs
          IDB_ENGINES=firefox,webkit node tests/browser-idb-new-install.mjs
          IDB_ENGINES=firefox,webkit node tests/browser-idb-migration-acceptance.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-bitcoin-history.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-storage.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-purchase-evidence.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-unified-bitcoin.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-kraken-import.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-bitpanda-import.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-historical-position-value.mjs
          FLH02_ENGINES=firefox,webkit node tests/browser-flh02-release.mjs
          HISTORY_ENGINES=firefox,webkit node tests/browser-history-worker.mjs
          UI_QUALITY_ENGINES=firefox,webkit node tests/browser-flatex-native-ui.mjs
          UI_QUALITY_ENGINES=firefox,webkit node tests/browser-flatex-native-commit.mjs
          UI_QUALITY_ENGINES=firefox,webkit node tests/browser-flatex-net-settlement.mjs
        fi
    - name: Preserve cross-engine evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b1-cross-engine-gates-${{ github.sha }}-${{ matrix.shard }}
        path: artifacts/gates/
        if-no-files-found: ignore
        retention-days: 7
    name: b1 / cross (${{ matrix.shard }})
  b1_wallet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
