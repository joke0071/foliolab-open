  b1_quality_chromium:
    needs:
    - b1_plan
    if: needs.b1_plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        ref: 9803a2c849dbe9aaca88c756daea2d892c8cc56d
        persist-credentials: false
    - uses: actions/setup-node@v4
