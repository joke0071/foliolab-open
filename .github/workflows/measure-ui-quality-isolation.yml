      run: |
        set -euo pipefail
        node --input-type=module <<'JS'
        import {readFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        const files=[['c5-positions','artifacts/gates/ui-positions-390.png'],['c5-bookings','artifacts/gates/c5-bookings-390.png'],['c5-connections','artifacts/gates/c5-connections-390.png'],['c5-connections-viewport','artifacts/gates/c5-connections-viewport-390.png']];
        for(const [id,path]of files){
          const bytes=readFileSync(path);
          if(bytes.length>256000)throw Error('Synthetic screenshot exceeds bounded review payload');
          const data=bytes.toString('base64');
          console.log('LIVE_IMAGE_BEGIN '+JSON.stringify({id,path,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),release:process.env.GITHUB_SHA}));
          for(let offset=0;offset<data.length;offset+=4000)console.log('LIVE_IMAGE_CHUNK '+id+' '+offset/4000+' '+data.slice(offset,offset+4000));
          console.log('LIVE_IMAGE_END '+id);
        }
        JS
