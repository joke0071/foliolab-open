name: FX bounded production domain control
on:
  pull_request:
    branches: [feature/flh05-import-foundation]
    paths: ['.github/workflows/fx-release-domain-control.yml', 'tests/diagnostics/fx-domain-control.mjs', 'tests/diagnostics/fx-domain-observer.mjs']
permissions:
  contents: read
jobs:
  compare:
    if: github.event.action == 'opened'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - engine: firefox
            playwright: 1.64.1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {path: qa, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {path: app, ref: 494ed8f0f6b627d8be972a5ceb886005e5064b31, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: fx-compare-${{ matrix.engine }}-${{ matrix.playwright }}-${{ runner.os }}
      - name: Install prescribed engine
        working-directory: app
        run: |
          npm install --no-save playwright@${{ matrix.playwright }}
          npx playwright install --with-deps ${{ matrix.engine }}
          ln -s "$PWD/node_modules" ../qa/node_modules
      - name: Two original full production-domain cases after successful local comparison
        working-directory: app
        env:
          QA_ROOT: ${{ github.workspace }}/qa
          FX_ENGINE: ${{ matrix.engine }}
          RELEASE_SHA: 494ed8f0f6b627d8be972a5ceb886005e5064b31
        run: node ../qa/tests/diagnostics/fx-domain-control.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-domain-${{ matrix.engine }}-${{ github.run_id }}
          path: domain/
          if-no-files-found: error
          retention-days: 30
